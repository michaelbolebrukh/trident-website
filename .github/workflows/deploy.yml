name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pushes to main go to staging; production is a deliberate manual run.
    environment: ${{ inputs.target || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Staging must never be indexed — it would compete with the live domain.
          PUBLIC_NOINDEX: ${{ (inputs.target == 'production') && '0' || '1' }}
        run: npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          # printf, not echo — the key must end with a newline or ssh rejects it.
          # tr strips CR: a key copied on Windows carries CRLF, which OpenSSH
          # refuses to parse.
          printf '%s\n' "${{ secrets.SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "Key file: $(wc -l < ~/.ssh/deploy_key) lines"

          if head -n1 ~/.ssh/deploy_key | grep -q '^ssh-'; then
            echo "::error::SSH_KEY holds a PUBLIC key. It needs the private one — the file WITHOUT the .pub extension."
            exit 1
          fi
          if ! grep -q 'BEGIN .*PRIVATE KEY' ~/.ssh/deploy_key; then
            echo "::error::SSH_KEY is missing its -----BEGIN ... PRIVATE KEY----- header line. Copy the whole file, header and footer included."
            exit 1
          fi
          # -P '' supplies an empty passphrase, so an encrypted key reports
          # itself rather than hanging. Keep ssh-keygen's own message: it
          # names the fault far better than a guess can.
          if ! err=$(ssh-keygen -y -P '' -f ~/.ssh/deploy_key 2>&1 >/dev/null); then
            echo "ssh-keygen reported: $err"
            case "$err" in
              *passphrase*|*decrypt*)
                echo "::error::SSH_KEY is passphrase-protected. GitHub Actions cannot enter a passphrase. Regenerate the key with an empty one: ssh-keygen -t ed25519 -f \$env:USERPROFILE\\.ssh\\hostinger_deploy  (press Enter at both prompts), re-add the .pub in hPanel, and update the SSH_KEY secret."
                ;;
              *)
                echo "::error::SSH_KEY will not parse. See the ssh-keygen message above."
                ;;
            esac
            exit 1
          fi
          echo "Deploy key fingerprint (must match the key listed in hPanel):"
          ssh-keygen -lf ~/.ssh/deploy_key

          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Verify connection
        # BatchMode stops ssh falling back to an interactive password prompt,
        # so an auth failure is reported as one instead of a generic timeout.
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" true \
            || {
              echo "::error::SSH authentication failed. Check that the matching public key is added under hPanel > Advanced > SSH Access, and that SSH_USER and SSH_HOST are correct."
              exit 1
            }

      - name: Verify remote path
        # Guard against a mistyped SSH_PATH: rsync --delete would otherwise
        # happily empty whatever directory it was pointed at.
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "test -d '${{ secrets.SSH_PATH }}'" \
            || { echo "::error::Connected fine, but SSH_PATH does not exist on the server."; exit 1; }

      - name: Deploy
        # --delay-updates stages every changed file remotely and renames them
        # into place at the end, and --delete-after removes stale files only
        # once the transfer succeeds. Without these, rsync deletes first and
        # writes progressively, so visitors mid-deploy can hit a missing or
        # half-written index.html — which the CDN then caches.
        run: |
          rsync -avz --delete-after --delay-updates \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o BatchMode=yes -o IdentitiesOnly=yes" \
            dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PATH }}/"

      - name: Verify the deployed site responds
        run: |
          url="${{ vars.SITE_URL || 'https://moccasin-quail-582986.hostingersite.com' }}"
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url/" || echo 000)
            if [ "$code" = "200" ]; then
              echo "$url returned 200"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code, retrying..."
            sleep 5
          done
          echo "::error::Site did not return 200 after deploy (last status $code)."
          exit 1

      - name: Summary
        run: |
          echo "Deployed to ${{ inputs.target || 'staging' }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
